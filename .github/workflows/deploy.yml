name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests & audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Dependency audit
        run: |
          composer audit
          npm audit --audit-level=high

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci
          npm run build
          rm -f public_html/hot
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            app bootstrap config database/migrations database/seeders database/factories \
            lang public_html resources routes vendor artisan composer.json composer.lock

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${SSH_HOST}
            Port ${SSH_PORT:-22}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload release
        run: |
          scp "$RUNNER_TEMP/release.tar.gz" production:"$DEPLOY_PATH/release.tar.gz"

      - name: Activate release
        run: |
          ssh production "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP="${PHP_BIN:-php}"

          test -f .env || { echo "::error::.env is missing on the server"; exit 1; }

          # Bring the site back up whatever happens after this point.
          trap '"$PHP" artisan up || true; rm -f release.tar.gz' EXIT

          "$PHP" artisan down --retry=30 || true

          # Remove old framework/vendor code so deleted files do not linger, then unpack.
          rm -rf vendor bootstrap/cache/*.php
          tar -xzf release.tar.gz

          mkdir -p storage/app/private/backups storage/framework/{cache,sessions,views} storage/logs
          "$PHP" artisan database:backup
          "$PHP" artisan migrate --force
          "$PHP" artisan optimize:clear
          "$PHP" artisan optimize
          "$PHP" artisan queue:restart || true

          # Keep only the 14 most recent backups.
          ls -1t storage/app/private/backups/database-*.sql 2>/dev/null | tail -n +15 | xargs -r rm -f
          REMOTE

      - name: Smoke test
        run: |
          for path in / /jobs /artikel /contact /robots.txt /sitemap.xml /up; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://thesolutionid.my.id$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
