name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests & audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Dependency audit
        run: |
          composer audit
          npm audit --audit-level=high

  # Readiness check for moving the server to PHP 8.4 (8.2 security support ends 31 Dec 2026).
  test-php84:
    name: Tests on PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies & build assets
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci
          npm run build
          rm -f public_html/hot
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            app bootstrap config database/migrations database/seeders database/factories \
            lang public_html resources routes scripts vendor artisan composer.json composer.lock

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${SSH_HOST}
            Port ${SSH_PORT:-22}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload release
        run: |
          scp "$RUNNER_TEMP/release.tar.gz" production:"$DEPLOY_PATH/release.tar.gz"

      - name: Activate release
        run: |
          ssh production "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP="${PHP_BIN:-php}"

          # Which PHP the command line uses here (the web version is set per domain in DirectAdmin).
          echo "CLI PHP ($PHP): $("$PHP" -r 'echo PHP_VERSION;')"
          echo "PHP 8.x binaries on this server:"
          ls -1d /opt/alt/php8*/usr/bin/php /usr/local/php8*/bin/php 2>/dev/null || echo "  (none found in the usual places)"

          test -f .env || { echo "::error::.env is missing on the server"; exit 1; }

          # Bring the site back up whatever happens after this point.
          trap '"$PHP" artisan up || true; rm -f release.tar.gz' EXIT

          "$PHP" artisan down --retry=30 || true

          # Remove old framework/vendor code so deleted files do not linger, then unpack.
          rm -rf vendor bootstrap/cache/*.php
          tar -xzf release.tar.gz

          mkdir -p storage/app/private/backups storage/framework/{cache,sessions,views} storage/logs

          # Hardening: PHP runs as the account owner, so nothing needs to be world-writable.
          chmod 600 .env
          find . -path ./node_modules -prune -o -type d -perm /o+w -exec chmod 755 {} +
          find . -path ./node_modules -prune -o -type f -perm /o+w -exec chmod 644 {} +

          # public_html/storage must be a symlink, otherwise uploaded images return 404.
          if [ ! -L public_html/storage ]; then
            rm -f public_html/storage
            ln -s ../storage/app/public public_html/storage
          fi

          # Files that must not be served from the docroot (moved, not deleted).
          mkdir -p storage/app/private/removed-from-docroot
          for f in info.php robots.txt test.html; do
            if [ -f "public_html/$f" ]; then
              mv "public_html/$f" "storage/app/private/removed-from-docroot/$f.$(date +%Y%m%d%H%M%S)"
            fi
          done

          bash scripts/backup-database.sh
          "$PHP" artisan migrate --force
          "$PHP" artisan optimize:clear
          "$PHP" artisan optimize
          "$PHP" artisan queue:restart || true

          REMOTE

      # Runs on the server against Apache directly: requests from GitHub's IPs get the
      # hosting provider's anti-bot page (HTTP 200), which would make checks meaningless.
      - name: Smoke test
        run: |
          ssh production "SSH_HOST='$SSH_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          R="--resolve thesolutionid.my.id:443:${SSH_HOST}"
          get() { curl -sk -m 20 $R -o /dev/null -w '%{http_code}' "https://thesolutionid.my.id$1"; }
          fail() { echo "::error::$1"; exit 1; }

          for path in / /jobs /artikel /contact /portfolio /about /robots.txt /sitemap.xml /storage/og-default.jpg; do
            code=$(get "$path"); echo "$path -> $code"; [ "$code" = "200" ] || fail "$path returned $code"
          done
          curl -sk -m 20 $R "https://thesolutionid.my.id/up" | grep -q "Application up" || fail "/up is not healthy"
          curl -sk -m 20 $R -D - -o /dev/null "https://thesolutionid.my.id/" | grep -qi '^content-security-policy:' || fail "CSP header missing"
          if curl -sk -m 20 $R "https://thesolutionid.my.id/info.php" | grep -q "PHP Version"; then fail "phpinfo is publicly reachable"; fi
          code=$(get "/artikel?q[]=x"); [ "$code" = "200" ] || fail "/artikel with array query returned $code"
          echo "Smoke test passed"
          REMOTE
